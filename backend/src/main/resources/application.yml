# application.yml
spring:
  application:
    name: ieum-festival

  datasource:
    url: jdbc:postgresql://localhost:5432/ieum
    username: ieum
    password: ieum1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

# JWT 설정
jwt:
  secret: ${JWT_SECRET:your-secret-key-at-least-256-bits-long-for-hs256}
  expiration: 86400000  # 24시간 (밀리초)

# Swagger 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    groups-order: DESC
  api-docs:
    path: /v3/api-docs
