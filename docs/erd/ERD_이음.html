<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920">
    <title>이음 - ERD (Entity Relationship Diagram)</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface-hover: #22263a;
            --border: #2a2e3f;
            --border-highlight: #3d4263;
            --text: #e4e6ef;
            --text-secondary: #8b8fa3;
            --text-muted: #5a5e73;
            --pk: #f59e0b;
            --fk: #6366f1;
            --unique: #10b981;
            --notnull: #ef4444;
            --core: #6366f1;
            --relation: #10b981;
            --support: #f59e0b;
            --line-color: #4a4f6a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(15, 17, 23, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .legend {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .controls {
            display: flex;
            gap: 8px;
        }

        .controls button {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }

        .controls button:hover {
            background: var(--surface-hover);
            border-color: var(--border-highlight);
        }

        /* Canvas */
        .canvas-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: grab;
            padding-top: 56px;
        }

        .canvas-container.dragging {
            cursor: grabbing;
        }

        .canvas {
            position: relative;
            transform-origin: 0 0;
            width: 3200px;
            height: 3200px;
        }

        /* SVG Lines */
        .lines-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .relation-line {
            stroke: var(--line-color);
            stroke-width: 1.5;
            fill: none;
            opacity: 0.6;
            transition: opacity 0.3s, stroke 0.3s;
        }

        .relation-line.highlight {
            stroke: #6366f1;
            stroke-width: 2.5;
            opacity: 1;
        }

        /* Table Card */
        .table-card {
            position: absolute;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-width: 260px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
            z-index: 10;
            transition: box-shadow 0.3s, border-color 0.3s;
            cursor: move;
            user-select: none;
        }

        .table-card:hover {
            box-shadow: 0 8px 40px rgba(99, 102, 241, 0.15);
            border-color: var(--border-highlight);
        }

        .table-card.highlight {
            border-color: #6366f1;
            box-shadow: 0 8px 40px rgba(99, 102, 241, 0.25);
        }

        .table-header {
            padding: 10px 14px;
            border-radius: 10px 10px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .table-header.core {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(99, 102, 241, 0.05));
        }

        .table-header.relation {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(16, 185, 129, 0.05));
        }

        .table-header.support {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(245, 158, 11, 0.05));
        }

        .table-name {
            font-size: 14px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        .table-name.core {
            color: #818cf8;
        }

        .table-name.relation {
            color: #34d399;
        }

        .table-name.support {
            color: #fbbf24;
        }

        .table-label {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .table-label.core {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
        }

        .table-label.relation {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }

        .table-label.support {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
        }

        .table-body {
            padding: 4px 0;
        }

        .column-row {
            display: flex;
            align-items: center;
            padding: 3px 14px;
            font-size: 12px;
            gap: 8px;
            transition: background 0.15s;
        }

        .column-row:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .col-badges {
            display: flex;
            gap: 3px;
            min-width: 42px;
        }

        .badge {
            font-size: 9px;
            font-weight: 600;
            padding: 1px 4px;
            border-radius: 3px;
            font-family: 'JetBrains Mono', monospace;
        }

        .badge.pk {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }

        .badge.fk {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
        }

        .badge.uk {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }

        .col-name {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--text);
            min-width: 120px;
        }

        .col-type {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            min-width: 80px;
        }

        .col-note {
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }

        .table-footer {
            padding: 6px 14px;
            border-top: 1px solid var(--border);
            font-size: 10px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Minimap */
        .minimap {
            position: fixed;
            bottom: 16px;
            right: 16px;
            width: 200px;
            height: 150px;
            background: rgba(26, 29, 39, 0.9);
            border: 1px solid var(--border);
            border-radius: 8px;
            z-index: 100;
            overflow: hidden;
        }

        .minimap-viewport {
            position: absolute;
            border: 1.5px solid #6366f1;
            background: rgba(99, 102, 241, 0.08);
            border-radius: 2px;
            pointer-events: none;
        }

        .minimap-table {
            position: absolute;
            border-radius: 2px;
        }

        /* Zoom indicator */
        .zoom-indicator {
            position: fixed;
            bottom: 16px;
            left: 16px;
            background: rgba(26, 29, 39, 0.9);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 12px;
            color: var(--text-secondary);
            z-index: 100;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Tooltip */
        .tooltip {
            position: fixed;
            background: var(--surface);
            border: 1px solid var(--border-highlight);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 12px;
            color: var(--text);
            z-index: 200;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            max-width: 300px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .tooltip.visible {
            opacity: 1;
        }
    </style>
</head>

        // ─── Relationships ───
        const relationships = [
            { from: 'users', to: 'reviews', label: '1:N', fromCol: 'user_id', toCol: 'user_id' },

            { from: 'users', to: 'comments', label: '1:N', fromCol: 'user_id', toCol: 'user_id' },

            { from: 'comments', to: 'comments', label: '1:N (자기참조)', fromCol: 'comment_id', toCol: 'parent_id' },

            { from: 'posts', to: 'attachments', label: '1:N (논리적)', fromCol: 'post_id', toCol: 'target_id' },
            { from: 'notices', to: 'attachments', label: '1:N (논리적)', fromCol: 'notice_id', toCol: 'target_id' },
            { from: 'inquiries', to: 'attachments', label: '1:N (논리적)', fromCol: 'inquiry_id', toCol: 'target_id' },
            { from: 'users', to: 'inquiries', label: '1:N', fromCol: 'user_id', toCol: 'user_id' },
            { from: 'users', to: 'reports', label: '1:N', fromCol: 'user_id', toCol: 'reporter_id' },
            { from: 'reports', to: 'report_responses', label: '1:N', fromCol: 'report_id', toCol: 'report_id' },
            { from: 'users', to: 'report_responses', label: '1:N', fromCol: 'user_id', toCol: 'admin_id' },
            { from: 'users', to: 'notifications', label: '1:N', fromCol: 'user_id', toCol: 'user_id' },
            { from: 'users', to: 'fcm_tokens', label: '1:N', fromCol: 'user_id', toCol: 'user_id' },
            { from: 'users', to: 'notification_settings', label: '1:1', fromCol: 'user_id', toCol: 'user_id' },
            { from: 'categories', to: 'posts', label: '1:N', fromCol: 'category_id', toCol: 'category_id' },

        // ─── Render ───
        const canvas = document.getElementById('canvas');
        const svgEl = document.getElementById('linesSvg');
        const container = document.getElementById('canvasContainer');
        const tableElements = {};

        let scale = 0.75;
        let panX = 50, panY = 0;
        let isDragging = false, dragTarget = null;
        let startX, startY, startPanX, startPanY, startTableX, startTableY;

        function renderTable(t) {
            const card = document.createElement('div');
            card.className = 'table-card';
            card.id = `table-${t.id}`;
            card.style.left = t.x + 'px';
            card.style.top = t.y + 'px';

            let colHTML = '';
            t.columns.forEach(c => {
                let badges = '';
                if (c.pk) badges += '<span class="badge pk">PK</span>';
                if (c.fk) badges += '<span class="badge fk">FK</span>';
                if (c.uk) badges += '<span class="badge uk">UK</span>';
                colHTML += `
            <div class="column-row" data-table="${t.id}" data-col="${c.name}">
                <div class="col-badges">${badges}</div>
                <span class="col-name">${c.name}</span>
                <span class="col-type">${c.type}</span>
                <span class="col-note">${c.note || ''}</span>
            </div>`;
            });

            let footerHTML = '';
            if (t.footer) {
                footerHTML = `<div class="table-footer">${t.footer}</div>`;
            }

            card.innerHTML = `
        <div class="table-header ${t.type}">
            <span class="table-name ${t.type}">${t.name}</span>
            <span class="table-label ${t.type}">${t.label}</span>
        </div>
        <div class="table-body">${colHTML}</div>
        ${footerHTML}`;

            card.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                dragTarget = t;
                startX = e.clientX;
                startY = e.clientY;
                startTableX = t.x;
                startTableY = t.y;
                e.stopPropagation();
            });

            card.addEventListener('mouseenter', () => highlightRelated(t.id));
            card.addEventListener('mouseleave', () => clearHighlights());

            canvas.appendChild(card);
            tableElements[t.id] = card;
        }

        function getTableCenter(id) {
            const el = tableElements[id];
            if (!el) return { x: 0, y: 0 };
            const t = tables.find(t => t.id === id);
            return {
                x: t.x + el.offsetWidth / 2,
                y: t.y + el.offsetHeight / 2
            };
        }

        function getConnectionPoint(fromId, toId) {
            const fromEl = tableElements[fromId];
            const toEl = tableElements[toId];
            const fromT = tables.find(t => t.id === fromId);
            const toT = tables.find(t => t.id === toId);

            const fromCx = fromT.x + fromEl.offsetWidth / 2;
            const fromCy = fromT.y + fromEl.offsetHeight / 2;
            const toCx = toT.x + toEl.offsetWidth / 2;
            const toCy = toT.y + toEl.offsetHeight / 2;

            const fromW = fromEl.offsetWidth / 2;
            const fromH = fromEl.offsetHeight / 2;
            const toW = toEl.offsetWidth / 2;
            const toH = toEl.offsetHeight / 2;

            const dx = toCx - fromCx;
            const dy = toCy - fromCy;

            function edgePoint(cx, cy, hw, hh, angle) {
                const absCos = Math.abs(Math.cos(angle));
                const absSin = Math.abs(Math.sin(angle));
                let px, py;
                if (absCos * hh > absSin * hw) {
                    const sign = Math.cos(angle) > 0 ? 1 : -1;
                    px = cx + sign * hw;
                    py = cy + Math.tan(angle) * sign * hw;
                } else {
                    const sign = Math.sin(angle) > 0 ? 1 : -1;
                    py = cy + sign * hh;
                    px = cx + (1 / Math.tan(angle)) * sign * hh;
                }
                return { x: px, y: py };
            }

            const angle = Math.atan2(dy, dx);
            const fromPt = edgePoint(fromCx, fromCy, fromW, fromH, angle);
            const toPt = edgePoint(toCx, toCy, toW, toH, angle + Math.PI);

            return { from: fromPt, to: toPt };
        }

        function drawLines() {
            svgEl.innerHTML = '';
            relationships.forEach((rel, i) => {
                const pts = getConnectionPoint(rel.from, rel.to);
                const mx = (pts.from.x + pts.to.x) / 2;
                const my = (pts.from.y + pts.to.y) / 2;

                const dx = pts.to.x - pts.from.x;
                const dy = pts.to.y - pts.from.y;
                const isMoreHorizontal = Math.abs(dx) > Math.abs(dy);

                let d;
                if (isMoreHorizontal) {
                    d = `M ${pts.from.x} ${pts.from.y} C ${mx} ${pts.from.y}, ${mx} ${pts.to.y}, ${pts.to.x} ${pts.to.y}`;
                } else {
                    d = `M ${pts.from.x} ${pts.from.y} C ${pts.from.x} ${my}, ${pts.to.x} ${my}, ${pts.to.x} ${pts.to.y}`;
                }

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', d);
                path.setAttribute('class', 'relation-line');
                path.setAttribute('data-from', rel.from);
                path.setAttribute('data-to', rel.to);
                path.id = `line-${i}`;

                // Arrowhead
                const arrowLen = 8;
                const adx = pts.to.x - mx;
                const ady = pts.to.y - my;
                const aAngle = Math.atan2(ady, adx);
                const arrowD = `M ${pts.to.x} ${pts.to.y} L ${pts.to.x - arrowLen * Math.cos(aAngle - 0.4)} ${pts.to.y - arrowLen * Math.sin(aAngle - 0.4)} M ${pts.to.x} ${pts.to.y} L ${pts.to.x - arrowLen * Math.cos(aAngle + 0.4)} ${pts.to.y - arrowLen * Math.sin(aAngle + 0.4)}`;
                const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                arrow.setAttribute('d', arrowD);
                arrow.setAttribute('class', 'relation-line');
                arrow.setAttribute('data-from', rel.from);
                arrow.setAttribute('data-to', rel.to);
                arrow.setAttribute('stroke-linecap', 'round');

                svgEl.appendChild(path);
                svgEl.appendChild(arrow);
            });
        }

        function highlightRelated(tableId) {
            // Highlight table card
            Object.values(tableElements).forEach(el => el.classList.remove('highlight'));
            tableElements[tableId]?.classList.add('highlight');

            // Highlight connected tables and lines
            const lines = svgEl.querySelectorAll('.relation-line');
            lines.forEach(line => {
                const from = line.getAttribute('data-from');
                const to = line.getAttribute('data-to');
                if (from === tableId || to === tableId) {
                    line.classList.add('highlight');
                    const otherId = from === tableId ? to : from;
                    tableElements[otherId]?.classList.add('highlight');
                } else {
                    line.classList.remove('highlight');
                }
            });
        }

        function clearHighlights() {
            Object.values(tableElements).forEach(el => el.classList.remove('highlight'));
            svgEl.querySelectorAll('.relation-line').forEach(l => l.classList.remove('highlight'));
        }

        // ─── Pan & Zoom ───
        function updateTransform() {
            canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            document.getElementById('zoomIndicator').textContent = Math.round(scale * 100) + '%';
            updateMinimap();
        }

        function zoomIn() { scale = Math.min(2, scale + 0.1); updateTransform(); }
        function zoomOut() { scale = Math.max(0.2, scale - 0.1); updateTransform(); }
        function resetView() { scale = 0.75; panX = 50; panY = 0; updateTransform(); }

        container.addEventListener('mousedown', (e) => {
            if (dragTarget) return;
            isDragging = true;
            container.classList.add('dragging');
            startX = e.clientX;
            startY = e.clientY;
            startPanX = panX;
            startPanY = panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (dragTarget) {
                const dx = (e.clientX - startX) / scale;
                const dy = (e.clientY - startY) / scale;
                dragTarget.x = startTableX + dx;
                dragTarget.y = startTableY + dy;
                const el = tableElements[dragTarget.id];
                el.style.left = dragTarget.x + 'px';
                el.style.top = dragTarget.y + 'px';
                drawLines();
                updateMinimap();
            } else if (isDragging) {
                panX = startPanX + (e.clientX - startX);
                panY = startPanY + (e.clientY - startY);
                updateTransform();
            }
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            dragTarget = null;
            container.classList.remove('dragging');
        });

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.05 : 0.05;
            const newScale = Math.min(2, Math.max(0.2, scale + delta));

            const rect = container.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            panX = mx - (mx - panX) * (newScale / scale);
            panY = my - (my - panY) * (newScale / scale);
            scale = newScale;
            updateTransform();
        }, { passive: false });

        // ─── Minimap ───
        function updateMinimap() {
            const minimap = document.getElementById('minimap');
            const mmW = 200, mmH = 150;
            const cW = 3200, cH = 2400;
            const scaleM = Math.min(mmW / cW, mmH / cH);

            let html = '';
            tables.forEach(t => {
                const el = tableElements[t.id];
                if (!el) return;
                const color = t.type === 'core' ? '#6366f1' : t.type === 'relation' ? '#10b981' : '#f59e0b';
                html += `<div class="minimap-table" style="left:${t.x * scaleM}px;top:${t.y * scaleM}px;width:${el.offsetWidth * scaleM}px;height:${el.offsetHeight * scaleM}px;background:${color};opacity:0.5;"></div>`;
            });

            const viewW = container.clientWidth / scale * scaleM;
            const viewH = container.clientHeight / scale * scaleM;
            const viewX = -panX / scale * scaleM;
            const viewY = (-panY + 56) / scale * scaleM;

            html += `<div class="minimap-viewport" style="left:${viewX}px;top:${viewY}px;width:${viewW}px;height:${viewH}px;"></div>`;
            minimap.innerHTML = html;
        }

        // ─── Init ───
        tables.forEach(renderTable);
        requestAnimationFrame(() => {
            drawLines();
            updateTransform();
        });
    </script>
