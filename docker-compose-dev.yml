# ===========================================
# 로컬 개발 전용 — DB만 Docker로 실행
# ===========================================
# 사용법:
#   시작: docker compose -f docker-compose-dev.yml up -d
#   중지: docker compose -f docker-compose-dev.yml down
#   초기화(데이터 삭제): docker compose -f docker-compose-dev.yml down -v
# ===========================================

services:
  dev-db:
    image: postgres:17
    container_name: ieum-dev-db
    environment:
      POSTGRES_DB: ieum
      POSTGRES_USER: ieum
      POSTGRES_PASSWORD: devpass123
    ports:
      - "5432:5432"
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  dev-db-data:
    name: ieum-dev-db-data
