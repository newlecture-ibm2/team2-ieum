name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "USER_ID=${USER_ID:-ieum}" > .env
          echo "TOUR_API_SERVICE_KEY=${TOUR_API_SERVICE_KEY}" >> .env
          echo "TOUR_API_BASE_URL=${TOUR_API_BASE_URL:-https://apis.data.go.kr/B551011/KorService2}" >> .env
          echo "SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}" >> .env
          echo "SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-ieum}" >> .env
          echo "DB_PORT=${DB_PORT:-5454}" >> .env
          echo "DB_NAME=${DB_NAME:-ieum-db}" >> .env
          echo "DB_PASSWORD=${DB_PASSWORD}" >> .env
          echo "JWT_SECRET=${JWT_SECRET}" >> .env
          echo "JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}" >> .env
          echo "SESSION_SECRET=${SESSION_SECRET}" >> .env
          echo "FRONTEND_PORT=${FRONTEND_PORT:-3333}" >> .env
          echo "BACKEND_URL=${BACKEND_URL:-http://localhost:8080}" >> .env
          echo "NEXT_PUBLIC_KAKAO_MAP_API_KEY=${NEXT_PUBLIC_KAKAO_MAP_API_KEY}" >> .env
          echo "OAUTH_KAKAO_CLIENT_ID=${OAUTH_KAKAO_CLIENT_ID}" >> .env
          echo "OAUTH_KAKAO_CLIENT_SECRET=${OAUTH_KAKAO_CLIENT_SECRET}" >> .env
          echo "OAUTH_NAVER_CLIENT_ID=${OAUTH_NAVER_CLIENT_ID}" >> .env
          echo "OAUTH_NAVER_CLIENT_SECRET=${OAUTH_NAVER_CLIENT_SECRET}" >> .env
        env:
          USER_ID: ${{ vars.USER_ID }}
          TOUR_API_SERVICE_KEY: ${{ secrets.TOUR_API_SERVICE_KEY }}
          TOUR_API_BASE_URL: ${{ vars.TOUR_API_BASE_URL }}
          SPRING_DATASOURCE_URL: ${{ vars.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ vars.SPRING_DATASOURCE_USERNAME }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRATION: ${{ vars.JWT_EXPIRATION }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          NEXT_PUBLIC_KAKAO_MAP_API_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_API_KEY }}
          OAUTH_KAKAO_CLIENT_ID: ${{ secrets.OAUTH_KAKAO_CLIENT_ID }}
          OAUTH_KAKAO_CLIENT_SECRET: ${{ secrets.OAUTH_KAKAO_CLIENT_SECRET }}
          OAUTH_NAVER_CLIENT_ID: ${{ secrets.OAUTH_NAVER_CLIENT_ID }}
          OAUTH_NAVER_CLIENT_SECRET: ${{ secrets.OAUTH_NAVER_CLIENT_SECRET }}

      - name: Create Firebase service key
        run: |
          echo "${FIREBASE_SERVICE_KEY_JSON}" > backend/src/main/resources/firebase-service-key.json
        env:
          FIREBASE_SERVICE_KEY_JSON: ${{ secrets.FIREBASE_SERVICE_KEY_JSON }}

      - name: Build and Deploy
        run: |
          docker compose build backend
          docker compose build frontend
          docker compose up -d --remove-orphans

      - name: Verify deployment
        run: |
          echo "=== Container Status ==="
          docker compose ps
          sleep 15
          echo ""
          echo "=== Health Check ==="
          curl -sf --max-time 10 -o /dev/null -w "Frontend : HTTP %{http_code}\n" http://localhost:${FRONTEND_PORT:-3333} || echo "Frontend : not responding"
        env:
          FRONTEND_PORT: ${{ vars.FRONTEND_PORT }}

      - name: Clean up old images
        run: docker image prune -f
